name: banknote_detector
description: Application de détection de billets de banque
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Camera et image
  image_picker: ^1.0.5
  image: ^4.1.3
  
  # HTTP requests
  http: ^1.1.0
  
  # État
  provider: ^6.0.5
  
  # Stockage local
  shared_preferences: ^2.2.2
  
  # Utilitaires
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
